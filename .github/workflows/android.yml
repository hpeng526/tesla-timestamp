name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 递增构建号 -> versionCode = 1 + BUILD_NUMBER，保证可覆盖安装
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APKs (signed release + debug)
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --console=plain

      - name: Verify release signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs "$APK"
          ${ANDROID_HOME}/build-tools/34.0.0/aapt2 dump badging "$APK" | head -1

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tesla-timestamp-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tesla-timestamp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 每次 push 到 main 自动更新滚动 Release（tag: latest-build），无需手动打 tag
  rolling-release:
    name: Publish rolling release (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: tesla-timestamp-release-apk
          path: dist

      - name: Rename APK with version and commit
        run: |
          cd dist
          for f in *.apk; do
            mv "$f" "tesla-timestamp-${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          done
          ls -la

      - name: Remove previous rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete latest-build --yes --cleanup-tag || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: 最新构建（main）
          prerelease: true
          make_latest: false
          body: |
            由 main 分支自动构建并签名，每次 push 覆盖更新。

            - 提交：${{ github.sha }}
            - 构建号：${{ github.run_number }}
            - versionCode：${{ github.run_number }} + 1
            - 安装：下载下方 APK 直接安装，可覆盖上一版（同一签名密钥）
          files: dist/*.apk

  # 打 v* 标签时发布正式 Release
  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: tesla-timestamp-release-apk
          path: dist

      - name: Rename artifact with version tag
        run: |
          cd dist
          for f in *.apk; do
            mv "$f" "tesla-timestamp-${GITHUB_REF_NAME}.apk"
          done
          ls -la

      - name: Remove stale assets from this release
        env:
          GH_TOKEN: ${GITHUB_TOKEN}
          GH_REPO: ${GITHUB_REPOSITORY}
        run: |
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null | \
            while read -r name; do
              [ -n "${name}" ] && gh release delete-asset "${GITHUB_REF_NAME}" "${name}" --yes || true
            done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true