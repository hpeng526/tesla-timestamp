name: iOS CI

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 1.0.2（若标签不存在则自动创建 v1.0.2）'
        required: true
      prerelease:
        description: '是否标记为 Pre-release'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      prerelease:
        type: boolean
        default: false

concurrency:
  group: iOS CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: swift test --package-path ios

      - name: Build iOS Simulator target (compile check)
        run: |
          xcodebuild \
            -project ios/TeslaTimestamp.xcodeproj \
            -scheme TeslaTimestamp \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/SimDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing \
            -quiet

      - name: Build unsigned Release IPA (iphoneos)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            VER="${INPUT_VERSION#v}"
          else
            VER="1.0.${GITHUB_RUN_NUMBER}"
          fi
          BUILD_VER="$((1 + GITHUB_RUN_NUMBER))"
          echo "Building MARKETING_VERSION=${VER}, CURRENT_PROJECT_VERSION=${BUILD_VER}"

          xcodebuild \
            -project ios/TeslaTimestamp.xcodeproj \
            -scheme TeslaTimestamp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BUILD_VER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            -quiet

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/TeslaTimestamp.app"
          STAGE_DIR="$RUNNER_TEMP/ipa_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/Payload"
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/TeslaTimestamp.app"
          rm -rf "$STAGE_DIR/Payload/TeslaTimestamp.app/Metadata.appintents"

          # 使用 ad-hoc 签名填充 CodeDirectory 哈希，同时兼容 Sideloadly / AltStore / SideStore 重签与 TrollStore 直装
          codesign --force --deep --sign - "$STAGE_DIR/Payload/TeslaTimestamp.app"
          codesign -dvv "$STAGE_DIR/Payload/TeslaTimestamp.app"

          mkdir -p ios/dist
          IPA_PATH="$GITHUB_WORKSPACE/ios/dist/tesla-timestamp-unsigned.ipa"
          (
            cd "$STAGE_DIR"
            zip -qry "$IPA_PATH" Payload
          )

          unzip -l "$IPA_PATH"
          plutil -p "$STAGE_DIR/Payload/TeslaTimestamp.app/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesla-timestamp-unsigned-ipa
          path: ios/dist/*.ipa
          if-no-files-found: error

  release:
    name: Publish iOS IPA to Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME}"
          else
            VER="${INPUT_VERSION#v}"
            NAME="v${VER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release tag: $NAME"

      - name: Ensure git tag exists (manual / called run)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "标签 $TAG 已存在，直接向该 Release 上传/更新 IPA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: tesla-timestamp-unsigned-ipa
          path: dist

      - name: Rename IPA with version tag
        run: |
          set -euo pipefail
          cd dist
          mv tesla-timestamp-unsigned.ipa "tesla-timestamp-${{ steps.tag.outputs.name }}-unsigned.ipa"
          ls -lh

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/*.ipa
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
