name: Android CI

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，例如 1.0.1（自动打 v1.0.1 标签）'
        required: true
      prerelease:
        description: '是否标记为 Pre-release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 递增构建号 -> versionCode = 1 + BUILD_NUMBER，保证可覆盖安装
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # secrets 不能出现在 if 里，先落到 env，再用 env 判断是否已配置签名密钥
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          KS="${RUNNER_TEMP}/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          {
            echo "TESLA_KS_PATH=$KS"
            echo "TESLA_KS_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TESLA_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "TESLA_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "签名密钥已从 secrets 载入"

      - name: Warn when signing key is missing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 等 secrets，本次只构建未签名产物、不发布 Release"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APKs (signed release + debug)
        working-directory: android
        env:
          # 打标签构建时版本号跟随标签（v1.0.0 -> 1.0.0），其余用 1.0.<构建号>
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --console=plain

      - name: Verify release signature
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -1

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tesla-timestamp-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tesla-timestamp-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # 发布：打 v* 标签 或 手动触发（手动时自动创建标签）
  release:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Skip when signing key is missing
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::未配置签名密钥，跳过发布"

      - name: Checkout
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            NAME="v$VER"
          else
            NAME="${{ github.ref_name }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release tag: $NAME"

      - name: Create tag (manual run)
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::标签 $TAG 已存在，请换一个版本号或先在 Releases 里删除"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Download release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/download-artifact@v4
        with:
          name: tesla-timestamp-release-apk
          path: dist

      - name: Rename artifact with version tag
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd dist
          for f in *.apk; do
            mv "$f" "tesla-timestamp-${{ steps.tag.outputs.name }}.apk"
          done
          ls -la

      - name: Remove previous release for this tag
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "${{ steps.tag.outputs.name }}" --yes || true

      - name: Publish release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}